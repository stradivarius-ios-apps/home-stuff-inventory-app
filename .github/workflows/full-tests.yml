name: Full Test Validation

run-name: Full Test Validation / ${{ inputs.source_ref || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or exact SHA to validate. Leave blank to use the selected workflow ref.
        type: string
        required: false
  workflow_call:
    inputs:
      source_ref:
        description: Branch, tag, or exact SHA to validate.
        type: string
        required: true
    outputs:
      validated_commit:
        description: Exact commit validated by the full test suite.
        value: ${{ jobs.full-test-suite.outputs.validated_commit }}
      validation_status:
        description: Successful reusable validation result.
        value: ${{ jobs.full-test-suite.outputs.validation_status }}

permissions:
  actions: read
  contents: read

concurrency:
  group: full-test-validation-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false

env:
  PROJECT: HomeStuffInventoryApp.xcodeproj
  SCHEME: HomeStuffInventoryApp
  CONFIGURATION: Debug
  DERIVED_DATA: DerivedData/FullTestValidation
  BUILD_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
  UI_SHARD_TIMEOUT_SECONDS: 1200
  TEST_PRODUCTS_ARTIFACT: full-test-products-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  source:
    name: Resolve Exact Source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Record exact validated source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$EVENT_REF" != refs/tags/v* ]]; then
              echo "Push execution is restricted to release tags matching v*."
              exit 1
            fi
            if [[ -n "$SOURCE_REF" ]]; then
              echo "Push/tag execution must not accept a source_ref override."
              exit 1
            fi
            if [[ "$sha" != "$EVENT_SHA" ]]; then
              echo "Release tag expected exact workflow SHA $EVENT_SHA, checked out $sha."
              exit 1
            fi
          elif [[ -z "$SOURCE_REF" && "$sha" != "$EVENT_SHA" ]]; then
            echo "Expected workflow SHA $EVENT_SHA, checked out $sha."
            exit 1
          fi
          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            requested_sha="$(ruby -r./.github/scripts/support/release_contract -e 'print ReleaseContract.strict_sha!(ARGV.fetch(0), label: "source_ref")' "$SOURCE_REF")"
            if [[ "$requested_sha" != "$sha" ]]; then
              echo "Requested SHA $SOURCE_REF resolved to unexpected commit $sha."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate explicit UI shard manifest
        run: ruby .github/scripts/full_test_validation.rb validate-manifest

  build-and-unit-tests:
    name: Build, Unit, and Localization Tests
    needs: source
    runs-on: macos-26
    timeout-minutes: 35
    outputs:
      test_products_artifact_id: ${{ steps.test-products.outputs.artifact-id }}

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Verify exact validated source
        env:
          VALIDATED_SHA: ${{ needs.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"

      - name: Show Xcode environment
        run: bash .github/scripts/configure_hosted_xcode.sh

      - name: Prepare shared test products and result directory
        run: |
          rm -rf "$DERIVED_DATA" TestResults
          mkdir -p TestResults

      - name: Build test products once
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$BUILD_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Resolve shared test run file
        id: test-run
        run: |
          set -euo pipefail
          test_run_count="$(find "$DERIVED_DATA/Build/Products" -name '*.xctestrun' -type f | wc -l | tr -d ' ')"
          if [[ "$test_run_count" != "1" ]]; then
            echo "Expected exactly one generated .xctestrun file; found $test_run_count."
            find "$DERIVED_DATA/Build/Products" -name '*.xctestrun' -type f | sort
            exit 1
          fi
          test_run="$(find "$DERIVED_DATA/Build/Products" -name '*.xctestrun' -type f -print -quit)"
          echo "path=$test_run" >> "$GITHUB_OUTPUT"

      - name: Run full unit and localization tests without rebuilding
        id: unit-tests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "${{ steps.test-run.outputs.path }}" \
            -destination "$BUILD_DESTINATION" \
            -only-testing:HomeStuffInventoryAppTests \
            -resultBundlePath TestResults/UnitTests.xcresult 2>&1 | tee TestResults/UnitTests.log
          exit "${PIPESTATUS[0]}"

      - name: Reject empty successful unit results
        id: unit-result
        if: steps.unit-tests.outcome == 'success'
        run: ruby .github/scripts/full_test_validation.rb validate-unit-result TestResults

      - name: Package immutable shared test products
        if: steps.unit-tests.outcome == 'success' && steps.unit-result.outcome == 'success'
        run: tar -czf TestResults/FullTestProducts.tar.gz -C "$DERIVED_DATA/Build" Products

      - name: Upload immutable shared test products
        id: test-products
        if: steps.unit-tests.outcome == 'success' && steps.unit-result.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TEST_PRODUCTS_ARTIFACT }}
          path: TestResults/FullTestProducts.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload failed unit diagnostics
        if: steps.unit-tests.outcome == 'failure' || steps.unit-result.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-test-unit-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/UnitTests.xcresult
            TestResults/UnitTests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail when unit or localization tests failed
        if: steps.unit-tests.outcome != 'success' || steps.unit-result.outcome != 'success'
        run: exit 1

  ui-shards:
    name: UI Shard ${{ matrix.shard }}
    needs:
      - source
      - build-and-unit-tests
    strategy:
      fail-fast: false
      matrix:
        shard:
          - "01"
          - "02"
          - "03"
          - "04"
          - "05"
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"
          - "11"
          - "12"
          - "13"
          - "14"
          - "15"
          - "16"
          - "17"
          - "18"
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out exact validated source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Verify exact validated source
        env:
          VALIDATED_SHA: ${{ needs.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"

      - name: Show Xcode environment
        run: bash .github/scripts/configure_hosted_xcode.sh

      - name: Prepare shard directories
        run: |
          rm -rf "$DERIVED_DATA" TestResults
          mkdir -p "$DERIVED_DATA/Build" TestResults

      - name: Download immutable shared test products
        env:
          ARTIFACT_ID: ${{ needs.build-and-unit-tests.outputs.test_products_artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "Expected one numeric test-products artifact ID; received '$ARTIFACT_ID'."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output TestResults/FullTestProducts.zip
          unzip -q TestResults/FullTestProducts.zip -d TestResults
          test -s TestResults/FullTestProducts.tar.gz

      - name: Restore shared test products
        run: tar -xzf TestResults/FullTestProducts.tar.gz -C "$DERIVED_DATA/Build"

      - name: Resolve shared test run file
        id: test-run
        run: |
          set -euo pipefail
          test_run_count="$(find "$DERIVED_DATA/Build/Products" -name '*.xctestrun' -type f | wc -l | tr -d ' ')"
          if [[ "$test_run_count" != "1" ]]; then
            echo "Expected exactly one restored .xctestrun file; found $test_run_count."
            exit 1
          fi
          echo "path=$(find "$DERIVED_DATA/Build/Products" -name '*.xctestrun' -type f -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Create isolated shard simulator
        id: simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          simulator="$(xcrun simctl create "HSI Full Tests ${{ matrix.shard }} ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "iPhone 17" "com.apple.CoreSimulator.SimRuntime.iOS-26-5")"
          echo "udid=$simulator" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b

      - name: Run bounded UI shard without rebuilding
        id: ui-shard
        continue-on-error: true
        run: |
          ruby .github/scripts/full_test_validation.rb run-ui-shard \
            "${{ matrix.shard }}" \
            "${{ steps.test-run.outputs.path }}" \
            "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            TestResults

      - name: Report UI shard timing
        if: always()
        env:
          VALIDATED_SHA: ${{ needs.source.outputs.sha }}
        run: ruby .github/scripts/full_test_validation.rb summarize TestResults

      - name: Print failed UI shard diagnostics
        if: always() && steps.ui-shard.outputs.status != 'success'
        run: |
          log="TestResults/UIShard${{ matrix.shard }}.log"
          grep -Eni -C 20 "assertion failure|xctassert|test case.*failed|\*\* test execute failed \*\*" "$log" || true
          tail -n 250 "$log" || true

      - name: Upload failed UI shard diagnostics
        if: always() && steps.ui-shard.outputs.status != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-test-ui-shard-${{ matrix.shard }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/UIShard${{ matrix.shard }}.xcresult
            TestResults/UIShard${{ matrix.shard }}.log
            TestResults/ui-shard-summary.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Delete isolated shard simulator
        if: always()
        run: |
          simulator="${{ steps.simulator.outputs.udid }}"
          if [[ -n "$simulator" ]]; then
            xcrun simctl shutdown "$simulator" || true
            xcrun simctl delete "$simulator" || true
          fi

      - name: Fail when UI shard failed
        if: always() && steps.ui-shard.outputs.status != 'success'
        run: exit 1

  full-test-suite:
    name: Full Test Suite
    if: always()
    needs:
      - source
      - build-and-unit-tests
      - ui-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validated_commit: ${{ needs.source.outputs.sha }}
      validation_status: ${{ steps.result.outputs.status }}

    steps:
      - name: Fail unless every full-test stage succeeded
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          BUILD_AND_UNIT_RESULT: ${{ needs.build-and-unit-tests.result }}
          UI_SHARDS_RESULT: ${{ needs.ui-shards.result }}
        run: |
          if [[ "$SOURCE_RESULT" != "success" || "$BUILD_AND_UNIT_RESULT" != "success" || "$UI_SHARDS_RESULT" != "success" ]]; then
            exit 1
          fi

      - name: Record successful full validation
        id: result
        run: echo "status=success" >> "$GITHUB_OUTPUT"
