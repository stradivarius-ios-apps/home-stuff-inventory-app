name: Release App Store Screenshots

on:
  workflow_call:
    inputs:
      release_ref:
        description: Exact release tag or full commit SHA to capture.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-app-store-screenshots-${{ inputs.release_ref }}
  cancel-in-progress: false

env:
  PROJECT: HomeStuffInventoryApp.xcodeproj
  SCHEME: HomeStuffInventoryApp
  CONFIGURATION: Debug
  RELEASE_SCREENSHOT_DEVICE: iPhone 14 Plus
  RELEASE_SCREENSHOT_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-14-Plus
  RELEASE_SCREENSHOT_SIMULATOR_NAME: Home Stuff Release Screenshots iPhone 14 Plus
  RELEASE_SCREENSHOT_OS: "26.5"
  RELEASE_SCREENSHOT_APPEARANCE: Light

jobs:
  release-app-store-screenshots:
    name: Capture release App Store screenshots
    runs-on: macos-26-intel
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release ref input
        id: requested
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          resolved_ref="$(ruby .github/scripts/resolve_release_screenshot_ref.rb "$RELEASE_REF")"
          echo "ref=$resolved_ref" >> "$GITHUB_OUTPUT"

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.requested.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Summarize resolved release source
        id: source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "$RELEASE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            requested_sha="$(ruby -r./.github/scripts/support/release_contract -e 'print ReleaseContract.strict_sha!(ARGV.fetch(0), label: "release_ref")' "$RELEASE_REF")"
            if [[ "$requested_sha" != "$source_sha" ]]; then
              echo "Requested SHA $RELEASE_REF resolved to unexpected commit $source_sha."
              exit 1
            fi
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Release screenshot source"
            echo
            echo "- Requested ref: \`$RELEASE_REF\`"
            echo "- Resolved commit: \`$source_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show Xcode environment
        run: bash .github/scripts/configure_hosted_xcode.sh

      - name: Show hosted simulator environment
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list devices available

      - name: Capture and validate release screenshots
        env:
          RELEASE_SCREENSHOT_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: bash .github/scripts/capture_release_app_store_screenshots.sh

      - name: Upload release screenshot result bundle on failure
        id: failure-upload
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-app-store-screenshot-result-${{ github.run_id }}
          path: TestResults/ReleaseAppStoreScreenshots.xcresult
          if-no-files-found: ignore
          retention-days: 3

      - name: Summarize release screenshot result
        if: always()
        env:
          FAILURE_URL: ${{ steps.failure-upload.outputs.artifact-url }}
        run: |
          {
            echo
            echo "## Release App Store screenshot result"
            if [[ -f release-app-store-screenshots/summary.md ]]; then
              cat release-app-store-screenshots/summary.md
              echo
              echo "- Validated screenshots remain in this job workspace only."
            else
              echo "Capture or validation failed."
              if [[ -n "$FAILURE_URL" ]]; then echo "- Failure xcresult: $FAILURE_URL"; fi
            fi
            echo
            echo "This workflow does not commit screenshots or publish to App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"
