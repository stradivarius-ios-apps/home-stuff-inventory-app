name: Validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_app_validation:
        description: Run the simulator build, tests, and coverage jobs.
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: HomeStuffInventoryApp.xcodeproj
  SCHEME: HomeStuffInventoryApp
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
  CONFIGURATION: Debug

jobs:
  classify-changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      app_validation_required: ${{ steps.classify.outputs.app_validation_required }}
      ci_validation_required: ${{ steps.classify.outputs.ci_validation_required }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Verify exact validation source
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "${{ github.sha }}" ]]; then
            echo "Expected workflow SHA ${{ github.sha }}, checked out $actual_sha."
            exit 1
          fi
          echo "Validated SHA: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate tracked public surface
        run: ruby .github/scripts/validate_public_surface.rb

      - name: Prepare exact tracked candidate
        run: ruby .github/scripts/prepare_tracked_public_candidate.rb "$RUNNER_TEMP/public-candidate"

      - name: Prepare pinned Gitleaks policy
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          trusted_config="$RUNNER_TEMP/gitleaks-ci.toml"
          trusted_ignore="$RUNNER_TEMP/gitleaks-ci.ignore"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" |
            sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

          printf '%s\n' '[extend]' 'useDefault = true' > "$trusted_config"
          : > "$trusted_ignore"

      - name: Verify trusted Gitleaks boundary
        run: >-
          ruby .github/scripts/verify_gitleaks_security_boundary.rb
          "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks-ci.toml"
          "$RUNNER_TEMP/gitleaks-ci.ignore"

      - name: Scan tracked candidate with pinned Gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/public-candidate" \
            --config "$RUNNER_TEMP/gitleaks-ci.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ci.ignore" \
            --ignore-gitleaks-allow \
            --no-banner \
            --redact=100 \
            --exit-code 1 \
            --log-level error

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_APP_VALIDATION: ${{ inputs.run_app_validation || 'false' }}
        run: |
          set -euo pipefail

          changed_files=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RUN_APP_VALIDATION" == "true" ]]; then
              app_validation_required=true
            else
              app_validation_required=false
            fi
            ci_validation_required=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
              head="$HEAD_SHA"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              base="$BEFORE_SHA"
              head="$HEAD_SHA"
            else
              base="$(git rev-parse "$HEAD_SHA^")"
              head="$HEAD_SHA"
            fi

            while IFS= read -r file; do
              changed_files+=("$file")
            done < <(git diff --name-only "$base" "$head" | sort)
            app_validation_required=false
            ci_validation_required=false

            for file in "${changed_files[@]}"; do
              case "$file" in
                HomeStuffInventoryApp/*|HomeStuffInventoryAppTests/*|HomeStuffInventoryAppUITests/*|HomeStuffInventoryApp.xcodeproj/*)
                  app_validation_required=true
                  ;;
                scripts/*)
                  app_validation_required=true
                  ci_validation_required=true
                  ;;
                .github/workflows/*|.github/scripts/*|Gemfile|fastlane/*)
                  app_validation_required=true
                  ci_validation_required=true
                  ;;
                docs/data/portability-recovery-v1/*|docs/data/portability-recovery-contract.md)
                  ci_validation_required=true
                  ;;
                README.md|AGENTS.md|docs/*)
                  ;;
                *)
                  app_validation_required=true
                  ;;
              esac
            done
          fi

          {
            echo "app_validation_required=$app_validation_required"
            echo "ci_validation_required=$ci_validation_required"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Change classification"
            echo
            echo "- App validation required: $app_validation_required"
            echo "- CI validation required: $ci_validation_required"
            if (( ${#changed_files[@]} > 0 )); then
              echo
              echo "Changed files:"
              printf -- "- \`%s\`\n" "${changed_files[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ci-validation:
    name: CI workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: classify-changes

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Validate workflow YAML syntax
        run: |
          ruby -ryaml -e 'ARGV.each { |file| YAML.load_file(file) }' .github/workflows/*.yml

      - name: Validate CI scripts
        run: |
          python3 -m py_compile scripts/ci/check-code-coverage.py

      - name: Run release automation checks
        run: ruby .github/scripts/run_public_automation_checks.rb

  fastlane-smoke-test:
    name: Locked Fastlane smoke test
    runs-on: macos-26-intel
    timeout-minutes: 15
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_validation_required == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up locked Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: "4.0.5"
          bundler: "2.7.2"
          bundler-cache: false

      - name: Verify production Ruby and Bundler
        run: |
          set -euo pipefail
          ruby -e 'abort "Expected production Ruby 4.0.5, found #{RUBY_VERSION}." unless RUBY_VERSION == "4.0.5"'
          test "$(bundle _2.7.2_ --version)" = "Bundler version 2.7.2"

      - name: Install locked Fastlane bundle
        run: |
          set -euo pipefail
          bundle _2.7.2_ config set path vendor/bundle
          bundle _2.7.2_ install --jobs 4 --retry 3

      - name: Load locked Fastlane default actions
        run: FASTLANE_SMOKE_TEST=true ruby .github/scripts/run_public_automation_checks.rb

  build-test:
    name: Build and test
    runs-on: macos-26-intel
    timeout-minutes: 60
    needs: classify-changes
    if: needs.classify-changes.outputs.app_validation_required == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Select hosted Xcode toolchain
        run: bash .github/scripts/configure_hosted_xcode.sh

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list devices available

      - name: Create isolated simulator
        run: |
          set -euo pipefail
          simulator_name="HSI Validation ${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          simulator_udid="$(xcrun simctl create "$simulator_name" "iPhone 17" "com.apple.CoreSimulator.SimRuntime.iOS-26-5")"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "DESTINATION=platform=iOS Simulator,id=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Prepare result bundle directory
        run: |
          rm -rf TestResults
          mkdir -p TestResults

      - name: Build app
        run: |
          rm -rf TestResults/Build.xcresult
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration "$CONFIGURATION" \
            -resultBundlePath TestResults/Build.xcresult

      - name: Run unit and localization tests
        run: |
          rm -rf TestResults/UnitTests.xcresult
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration "$CONFIGURATION" \
            -only-testing:HomeStuffInventoryAppTests \
            -resultBundlePath TestResults/UnitTests.xcresult

      - name: Run UI smoke baseline
        id: ui-smoke
        continue-on-error: true
        run: |
          rm -rf TestResults/UITests.xcresult
          ruby .github/scripts/bounded_process.rb run \
            --timeout-seconds 900 \
            --grace-seconds 10 \
            --progress-seconds 60 \
            --log TestResults/UITests.log \
            --summary TestResults/ui-smoke-summary.json \
            -- \
            xcodebuild test \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -configuration "$CONFIGURATION" \
              -only-testing:HomeStuffInventoryAppUITests/InventorySmokeUITests/testFreeReleaseGateLaunchCreateSearchAndReadWithoutEntitlement \
              -resultBundlePath TestResults/UITests.xcresult

      - name: Print UI smoke diagnostics
        if: steps.ui-smoke.outcome == 'failure'
        run: |
          echo "::group::UI smoke log"
          rg -n -i -C 20 "assertion failure|xctassert|test case.*failed|\*\* test execute failed \*\*" TestResults/UITests.log || true
          tail -n 250 TestResults/UITests.log || true
          echo "::endgroup::"

      - name: Upload result bundles on failure
        if: failure() || steps.ui-smoke.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcode-result-bundles
          path: |
            TestResults/*.xcresult
            TestResults/UITests.log
            TestResults/ui-smoke-summary.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Fail when UI smoke failed
        if: steps.ui-smoke.outcome == 'failure'
        run: exit 1

      - name: Delete isolated simulator
        if: always()
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
          fi

  code-coverage:
    name: Code coverage
    runs-on: macos-26-intel
    timeout-minutes: 60
    needs: classify-changes
    if: needs.classify-changes.outputs.app_validation_required == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Select hosted Xcode toolchain
        run: bash .github/scripts/configure_hosted_xcode.sh

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list devices available

      - name: Create isolated simulator
        run: |
          set -euo pipefail
          simulator_name="HSI Validation ${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          simulator_udid="$(xcrun simctl create "$simulator_name" "iPhone 17" "com.apple.CoreSimulator.SimRuntime.iOS-26-5")"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "DESTINATION=platform=iOS Simulator,id=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Prepare result bundle directory
        run: |
          rm -rf TestResults
          mkdir -p TestResults

      - name: Run coverage-enabled app tests
        run: |
          rm -rf TestResults/Coverage.xcresult
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration "$CONFIGURATION" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -only-testing:HomeStuffInventoryAppTests \
            -resultBundlePath TestResults/Coverage.xcresult

      - name: Enforce 90% app-code coverage
        run: |
          scripts/ci/check-code-coverage.py TestResults/Coverage.xcresult --minimum 90

      - name: Upload coverage result bundle on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xcode-result-bundle
          path: TestResults/Coverage.xcresult
          if-no-files-found: ignore
          retention-days: 3

      - name: Delete isolated simulator
        if: always()
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
          fi
