name: Validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_app_validation:
        description: Run the simulator build, tests, and coverage jobs.
        type: boolean
        default: true
        required: true
      run_swift_codeql_benchmark:
        description: Benchmark the manual Swift CodeQL build without uploading results.
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: HomeStuffInventoryApp.xcodeproj
  SCHEME: HomeStuffInventoryApp
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.5
  CONFIGURATION: Debug

jobs:
  classify-changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      app_validation_required: ${{ steps.classify.outputs.app_validation_required }}
      ci_validation_required: ${{ steps.classify.outputs.ci_validation_required }}
      app_validation_ready_at: ${{ steps.classify.outputs.app_validation_ready_at }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Verify exact validation source
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "${{ github.sha }}" ]]; then
            echo "Expected workflow SHA ${{ github.sha }}, checked out $actual_sha."
            exit 1
          fi
          echo "Validated SHA: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate tracked public surface
        run: ruby .github/scripts/validate_public_surface.rb

      - name: Prepare exact tracked candidate
        run: ruby .github/scripts/prepare_tracked_public_candidate.rb "$RUNNER_TEMP/public-candidate"

      - name: Prepare pinned Gitleaks policy
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          trusted_config="$RUNNER_TEMP/gitleaks-ci.toml"
          trusted_ignore="$RUNNER_TEMP/gitleaks-ci.ignore"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" |
            sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

          printf '%s\n' '[extend]' 'useDefault = true' > "$trusted_config"
          : > "$trusted_ignore"

      - name: Verify trusted Gitleaks boundary
        run: >-
          ruby .github/scripts/verify_gitleaks_security_boundary.rb
          "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks-ci.toml"
          "$RUNNER_TEMP/gitleaks-ci.ignore"

      - name: Scan tracked candidate with pinned Gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/public-candidate" \
            --config "$RUNNER_TEMP/gitleaks-ci.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ci.ignore" \
            --ignore-gitleaks-allow \
            --no-banner \
            --redact=100 \
            --exit-code 1 \
            --log-level error

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_APP_VALIDATION: ${{ inputs.run_app_validation || 'false' }}
        run: |
          set -euo pipefail

          changed_files=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RUN_APP_VALIDATION" == "true" ]]; then
              app_validation_required=true
            else
              app_validation_required=false
            fi
            ci_validation_required=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
              head="$HEAD_SHA"
            elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              base="$BEFORE_SHA"
              head="$HEAD_SHA"
            else
              base="$(git rev-parse "$HEAD_SHA^")"
              head="$HEAD_SHA"
            fi

            while IFS= read -r file; do
              changed_files+=("$file")
            done < <(git diff --name-only "$base" "$head" | sort)
            app_validation_required=false
            ci_validation_required=false

            for file in "${changed_files[@]}"; do
              case "$file" in
                HomeStuffInventoryApp/*|HomeStuffInventoryAppTests/*|HomeStuffInventoryAppUITests/*|HomeStuffInventoryApp.xcodeproj/*)
                  app_validation_required=true
                  ;;
                scripts/*)
                  app_validation_required=true
                  ci_validation_required=true
                  ;;
                .github/workflows/*|.github/scripts/*|Gemfile|fastlane/*)
                  app_validation_required=true
                  ci_validation_required=true
                  ;;
                docs/data/portability-recovery-v1/*|docs/data/portability-recovery-contract.md)
                  ci_validation_required=true
                  ;;
                README.md|AGENTS.md|docs/*)
                  ;;
                *)
                  app_validation_required=true
                  ;;
              esac
            done
          fi

          {
            echo "app_validation_required=$app_validation_required"
            echo "ci_validation_required=$ci_validation_required"
            echo "app_validation_ready_at=$(date -u +%s)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Change classification"
            echo
            echo "- App validation required: $app_validation_required"
            echo "- CI validation required: $ci_validation_required"
            if (( ${#changed_files[@]} > 0 )); then
              echo
              echo "Changed files:"
              printf -- "- \`%s\`\n" "${changed_files[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ci-contracts:
    name: CI contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: classify-changes

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Validate workflow YAML syntax
        run: |
          ruby -ryaml -e 'ARGV.each { |file| YAML.load_file(file) }' .github/workflows/*.yml

      - name: Validate CI scripts
        run: |
          python3 -m py_compile scripts/ci/check-code-coverage.py

      - name: Run release automation checks
        run: ruby .github/scripts/run_public_automation_checks.rb

  fastlane-smoke-test:
    name: Locked Fastlane smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: classify-changes
    if: needs.classify-changes.outputs.ci_validation_required == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up locked Ruby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: "4.0.5"
          bundler: "2.7.2"
          bundler-cache: false

      - name: Verify production Ruby and Bundler
        run: |
          set -euo pipefail
          ruby -e 'abort "Expected production Ruby 4.0.5, found #{RUBY_VERSION}." unless RUBY_VERSION == "4.0.5"'
          test "$(bundle _2.7.2_ --version)" = "Bundler version 2.7.2"

      - name: Install locked Fastlane bundle
        run: |
          set -euo pipefail
          bundle _2.7.2_ config set path vendor/bundle
          bundle _2.7.2_ install --jobs 4 --retry 3

      - name: Load locked Fastlane default actions
        run: FASTLANE_SMOKE_TEST=true ruby .github/scripts/run_public_automation_checks.rb

  build-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    needs: classify-changes
    if: needs.classify-changes.outputs.app_validation_required == 'true'

    env:
      DERIVED_DATA: DerivedData/Validation

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Record app validation queue
        env:
          READY_AT: ${{ needs.classify-changes.outputs.app_validation_ready_at }}
        run: |
          set -euo pipefail
          started_at="$(date -u +%s)"
          test -n "$READY_AT"
          test "$started_at" -ge "$READY_AT"
          {
            echo "VALIDATION_JOB_STARTED_AT=$started_at"
            echo "VALIDATION_QUEUE_SECONDS=$((started_at - READY_AT))"
            echo "VALIDATION_SETUP_STARTED_AT=$started_at"
          } >> "$GITHUB_ENV"

      - name: Show Xcode environment
        run: bash .github/scripts/configure_hosted_xcode.sh

      - name: Create isolated simulator
        run: |
          set -euo pipefail
          simulator_name="HSI Validation ${GITHUB_RUN_ID}-${GITHUB_JOB}-${GITHUB_RUN_ATTEMPT}"
          simulator_udid="$(xcrun simctl create "$simulator_name" "iPhone 17" "com.apple.CoreSimulator.SimRuntime.iOS-26-5")"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          echo "DESTINATION=platform=iOS Simulator,id=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Prepare result bundle directory
        run: |
          rm -rf "$DERIVED_DATA" TestResults
          mkdir -p TestResults
          finished_at="$(date -u +%s)"
          echo "VALIDATION_SETUP_SECONDS=$((finished_at - VALIDATION_SETUP_STARTED_AT))" >> "$GITHUB_ENV"

      - name: Build coverage-enabled test products once
        id: build
        continue-on-error: true
        run: |
          set +e
          started_at="$(date -u +%s)"
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults/Build.xcresult
          status=$?
          finished_at="$(date -u +%s)"
          echo "VALIDATION_BUILD_SECONDS=$((finished_at - started_at))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Resolve shared test run file
        id: test-run
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          test_run_count="$(find "$DERIVED_DATA/Build/Products" -name '*.xctestrun' -type f | wc -l | tr -d ' ')"
          if [[ "$test_run_count" != "1" ]]; then
            echo "Expected exactly one generated .xctestrun file; found $test_run_count."
            find "$DERIVED_DATA/Build/Products" -name '*.xctestrun' -type f | sort
            exit 1
          fi
          echo "TEST_RUN_PATH=$(find "$DERIVED_DATA/Build/Products" -name '*.xctestrun' -type f -print -quit)" >> "$GITHUB_ENV"

      - name: Run coverage-enabled unit and localization tests without rebuilding
        id: unit-tests
        if: steps.build.outcome == 'success' && steps.test-run.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          started_at="$(date -u +%s)"
          xcodebuild test-without-building \
            -xctestrun "$TEST_RUN_PATH" \
            -destination "$DESTINATION" \
            -enableCodeCoverage YES \
            -parallel-testing-enabled NO \
            -only-testing:HomeStuffInventoryAppTests \
            -resultBundlePath TestResults/UnitTests.xcresult 2>&1 | tee TestResults/UnitTests.log
          status="${PIPESTATUS[0]}"
          finished_at="$(date -u +%s)"
          echo "VALIDATION_UNIT_SECONDS=$((finished_at - started_at))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Reject empty successful unit results
        id: unit-result
        if: steps.unit-tests.outcome == 'success'
        run: ruby .github/scripts/ordinary_validation.rb validate-result TestResults/UnitTests.xcresult unit/localization

      - name: Enforce 90% app-code coverage
        id: coverage
        if: steps.unit-tests.outcome == 'success' && steps.unit-result.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          started_at="$(date -u +%s)"
          scripts/ci/check-code-coverage.py TestResults/UnitTests.xcresult --minimum 90
          status=$?
          finished_at="$(date -u +%s)"
          echo "VALIDATION_COVERAGE_SECONDS=$((finished_at - started_at))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Run UI smoke baseline
        id: ui-smoke
        if: steps.build.outcome == 'success' && steps.test-run.outcome == 'success'
        continue-on-error: true
        run: |
          started_at="$(date -u +%s)"
          set +e
          ruby .github/scripts/bounded_process.rb run \
            --timeout-seconds 900 \
            --grace-seconds 10 \
            --progress-seconds 60 \
            --log TestResults/UITests.log \
            --summary TestResults/ui-smoke-summary.json \
            -- \
            xcodebuild test-without-building \
              -xctestrun "$TEST_RUN_PATH" \
              -destination "$DESTINATION" \
              -only-testing:HomeStuffInventoryAppUITests/InventorySmokeUITests/testFreeReleaseGateLaunchCreateSearchAndReadWithoutEntitlement \
              -resultBundlePath TestResults/UITests.xcresult
          status=$?
          finished_at="$(date -u +%s)"
          echo "VALIDATION_UI_SECONDS=$((finished_at - started_at))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Reject empty successful UI smoke result
        id: ui-result
        if: steps.ui-smoke.outcome == 'success'
        run: ruby .github/scripts/ordinary_validation.rb validate-result TestResults/UITests.xcresult "UI smoke"

      - name: Record diagnostics and cleanup start
        if: always()
        run: echo "VALIDATION_CLEANUP_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Print test diagnostics
        if: always() && (steps.build.outcome == 'failure' || steps.test-run.outcome == 'failure' || steps.unit-tests.outcome == 'failure' || steps.unit-result.outcome == 'failure' || steps.coverage.outcome == 'failure' || steps.ui-smoke.outcome == 'failure' || steps.ui-result.outcome == 'failure')
        run: |
          echo "::group::Unit/localization log"
          rg -n -i -C 20 "assertion failure|xctassert|test case.*failed|\*\* test execute failed \*\*" TestResults/UnitTests.log || true
          tail -n 250 TestResults/UnitTests.log || true
          echo "::endgroup::"
          echo "::group::UI smoke log"
          rg -n -i -C 20 "assertion failure|xctassert|test case.*failed|\*\* test execute failed \*\*" TestResults/UITests.log || true
          tail -n 250 TestResults/UITests.log || true
          echo "::endgroup::"

      - name: Upload result bundles on failure
        if: always() && (steps.build.outcome == 'failure' || steps.test-run.outcome == 'failure' || steps.unit-tests.outcome == 'failure' || steps.unit-result.outcome == 'failure' || steps.coverage.outcome == 'failure' || steps.ui-smoke.outcome == 'failure' || steps.ui-result.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-xcode-result-bundles
          path: |
            TestResults/*.xcresult
            TestResults/UnitTests.log
            TestResults/UITests.log
            TestResults/ui-smoke-summary.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Delete isolated simulator
        if: always()
        run: |
          if [[ -n "${SIMULATOR_UDID:-}" ]]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
            xcrun simctl delete "$SIMULATOR_UDID" || true
          fi
          finished_at="$(date -u +%s)"
          if [[ -n "${VALIDATION_CLEANUP_STARTED_AT:-}" ]]; then
            echo "VALIDATION_CLEANUP_SECONDS=$((finished_at - VALIDATION_CLEANUP_STARTED_AT))" >> "$GITHUB_ENV"
          fi

      - name: Summarize ordinary validation timing
        if: always()
        env:
          VALIDATED_SHA: ${{ github.sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          UI_OUTCOME: ${{ steps.ui-smoke.outcome }}
        run: ruby .github/scripts/ordinary_validation.rb summarize

      - name: Fail unless every app validation phase succeeded
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_RUN_OUTCOME: ${{ steps.test-run.outcome }}
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          UNIT_RESULT_OUTCOME: ${{ steps.unit-result.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          UI_OUTCOME: ${{ steps.ui-smoke.outcome }}
          UI_RESULT_OUTCOME: ${{ steps.ui-result.outcome }}
        run: |
          set -euo pipefail
          for outcome in \
            "$BUILD_OUTCOME" "$TEST_RUN_OUTCOME" "$UNIT_OUTCOME" \
            "$UNIT_RESULT_OUTCOME" "$COVERAGE_OUTCOME" "$UI_OUTCOME" "$UI_RESULT_OUTCOME"
          do
            if [[ "$outcome" != "success" ]]; then
              echo "A required app validation phase concluded with: $outcome"
              exit 1
            fi
          done

  swift-codeql-benchmark:
    name: Swift CodeQL manual-build benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.run_swift_codeql_benchmark
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact benchmark source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Select reviewed Xcode
        run: bash .github/scripts/configure_hosted_xcode.sh

      - name: Install pinned CodeQL bundle
        env:
          CODEQL_VERSION: "2.26.1"
          CODEQL_BUNDLE_SHA256: "a66b24319f10676fdf35bef2bbba6575d1c64edbec82e8e83f3f22c1b0151323"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/codeql-bundle.tar.zst"
          install_root="$RUNNER_TEMP/codeql-bundle"
          curl --fail --location --silent --show-error \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_VERSION}/codeql-bundle-osx64.tar.zst" \
            --output "$archive"
          printf '%s  %s\n' "$CODEQL_BUNDLE_SHA256" "$archive" |
            shasum --algorithm 256 --check
          mkdir -p "$install_root"
          tar -x --zstd --file "$archive" --directory "$install_root"
          codeql_cli="$(find "$install_root" -type f -name codeql -perm -111 -print -quit)"
          query_suite="$(find "$install_root" -type f -name swift-code-scanning.qls -print -quit)"
          test -x "$codeql_cli"
          test -f "$query_suite"
          echo "CODEQL_CLI=$codeql_cli" >> "$GITHUB_ENV"
          echo "CODEQL_SWIFT_SUITE=$query_suite" >> "$GITHUB_ENV"

      - name: Create manual Swift CodeQL database
        run: |
          set -euo pipefail
          started_at="$(date -u +%s)"
          "$CODEQL_CLI" database create "$RUNNER_TEMP/swift-codeql-database" \
            --language=swift \
            --source-root="$GITHUB_WORKSPACE" \
            --command="xcodebuild build -project '$PROJECT' -target '$SCHEME' -configuration Release -sdk iphoneos -arch arm64 CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES SWIFT_OPTIMIZATION_LEVEL=-Onone SWIFT_COMPILATION_MODE=singlefile DEBUG_INFORMATION_FORMAT=dwarf"
          finished_at="$(date -u +%s)"
          duration="$((finished_at - started_at))"
          echo "CODEQL_BUILD_SECONDS=$duration" >> "$GITHUB_ENV"
          printf 'Manual Swift CodeQL database creation: **%dm%02ds**\n' \
            "$((duration / 60))" "$((duration % 60))" >> "$GITHUB_STEP_SUMMARY"

      - name: Analyze benchmark database without upload
        run: |
          set -euo pipefail
          started_at="$(date -u +%s)"
          "$CODEQL_CLI" database analyze "$RUNNER_TEMP/swift-codeql-database" \
            "$CODEQL_SWIFT_SUITE" \
            --format=sarif-latest \
            --output="$RUNNER_TEMP/swift-codeql-results.sarif" \
            --threads=0
          test -s "$RUNNER_TEMP/swift-codeql-results.sarif"
          finished_at="$(date -u +%s)"
          duration="$((finished_at - started_at))"
          printf 'Manual Swift CodeQL query analysis: **%dm%02ds**\n' \
            "$((duration / 60))" "$((duration % 60))" >> "$GITHUB_STEP_SUMMARY"

  code-coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - classify-changes
      - build-test
    if: always() && needs.classify-changes.outputs.app_validation_required == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Confirm combined coverage gate
        env:
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
        run: test "$BUILD_TEST_RESULT" = "success"

  ci-validation:
    name: CI workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - classify-changes
      - ci-contracts
      - fastlane-smoke-test
      - build-test
      - code-coverage
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact validation source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Require every selected validation phase
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          CI_CONTRACT_RESULT: ${{ needs.ci-contracts.result }}
          FASTLANE_RESULT: ${{ needs.fastlane-smoke-test.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          CODE_COVERAGE_RESULT: ${{ needs.code-coverage.result }}
          APP_VALIDATION_REQUIRED: ${{ needs.classify-changes.outputs.app_validation_required }}
          CI_VALIDATION_REQUIRED: ${{ needs.classify-changes.outputs.ci_validation_required }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = "success"
          test "$CI_CONTRACT_RESULT" = "success"

          if [[ "$CI_VALIDATION_REQUIRED" == "true" ]]; then
            test "$FASTLANE_RESULT" = "success"
          else
            test "$FASTLANE_RESULT" = "skipped"
          fi

          if [[ "$APP_VALIDATION_REQUIRED" == "true" ]]; then
            test "$BUILD_TEST_RESULT" = "success"
            test "$CODE_COVERAGE_RESULT" = "success"
          else
            test "$BUILD_TEST_RESULT" = "skipped"
            test "$CODE_COVERAGE_RESULT" = "skipped"
          fi
